[package]
name = "kpa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace of one: keeps this crate (and its nightly-only
# `libfuzzer-sys` dependency) out of the root `kpa` workspace entirely, so
# `cargo build`/`cargo test` at the repo root never sees it.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64 = "0.22"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["ed25519", "alloc", "std"] }

[dependencies.kpa]
path = ".."

[[bin]]
name = "decode_request"
path = "fuzz_targets/decode_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_request"
path = "fuzz_targets/agent_request.rs"
test = false
doc = false
bench = false
