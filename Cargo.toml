[package]
name = "kpa"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small read-only KeePass agent"

[dependencies]
keepass = { version = "0.15.0", default-features = false, features = ["totp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
humantime-serde = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "net", "process", "termios"] }
uuid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.11"
zbus = "5"
wl-clipboard-rs = "0.9.5"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
rustix = { version = "1", features = ["stdio", "pty"] }
