[package]
name = "kpa"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small read-only KeePass agent"

[dependencies]
keepass = { version = "0.15.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
humantime-serde = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "net", "process"] }
uuid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.11"
zbus = "5"
wl-clipboard-rs = "0.9.5"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"
