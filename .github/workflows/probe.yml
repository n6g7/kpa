name: probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [two-cpus-two-hogs, one-cpu-one-hog, all-cpus-many-hogs, two-cpus-no-hogs]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: disabled
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nodebug-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: build the tests
        run: nix develop -c cargo test --no-run
      - name: loop the control tests under load
        run: |
          nproc
          cpus=$(nproc)
          case "${{ matrix.mode }}" in
            two-cpus-two-hogs) pin="0,1"; hogs=2 ;;
            one-cpu-one-hog) pin="0"; hogs=1 ;;
            all-cpus-many-hogs) pin="0-$((cpus - 1))"; hogs=$((cpus * 2)) ;;
            two-cpus-no-hogs) pin="0,1"; hogs=0 ;;
          esac
          for h in $(seq 1 $hogs); do
            taskset -c "$pin" sh -c 'while :; do :; done' &
          done
          fails=0
          for i in $(seq 1 8); do
            if ! taskset -c "$pin" nix develop -c cargo test --no-fail-fast --test control > "run-$i.log" 2>&1; then
              fails=$((fails + 1))
              echo "=== run $i failed"
              grep -E "FAILED|timed out" "run-$i.log" | head -8
              sed -n '/^---- /,/^failures:/p' "run-$i.log" | head -120
            else
              echo "run $i ok: $(grep -o 'finished in [0-9.]*s' "run-$i.log" | tail -1)"
            fi
          done
          echo "failures: $fails of 8"
          kill $(jobs -p) 2>/dev/null || true
