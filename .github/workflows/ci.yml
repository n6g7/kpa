name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A self-hosted runner with Nix installed. The repository is public,
    # and a pull request from a fork runs code its author controls: never
    # on this machine. Only pushes and pull requests from branches of this
    # repository run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    env:
      # Debuginfo makes every test binary huge; with the cached target/
      # it has filled the runner's disk during linking. CI never reads
      # the debuginfo.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # `nix develop` needs flakes, whatever the runner's own nix.conf
      # enables.
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v4

      # Nix is the single source of truth for the toolchain (see
      # flake.nix): cargo/rustc/clippy/rustfmt, plus keepassxc-cli,
      # python3+pykeepass and OpenSSH for the tests. The runner already
      # has Nix, and every step runs through `nix develop`, so CI runs the
      # exact same versions as `nix develop -c cargo test` locally —
      # nothing to keep in sync by hand. The dev shell is all public
      # nixpkgs, fetched from cache.nixos.org.

      # Nix caches the toolchain itself; this caches cargo's own build
      # artifacts (registry downloads + target/) across runs, keyed on
      # Cargo.lock so a dependency bump invalidates it automatically.
      # There is no restore-keys fallback: restoring an older cache next
      # to a rebuild piles stale artifacts into target/ and fills the
      # runner's disk.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nodebug-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: nix develop -c cargo fmt -- --check

      # assets/tray/*.png are committed (src/tray.rs embeds them), but
      # generated from assets/tray/*.svg by assets/tray/render.sh. Re-run
      # it and fail if that changes anything, so a stale PNG (edited by
      # hand, or left behind after an SVG edit) doesn't ship unnoticed.
      # resvg's version is pinned by flake.lock, so this is deterministic.
      - name: assets/tray PNGs match their SVGs
        run: |
          nix develop -c bash assets/tray/render.sh
          git diff --exit-code assets/tray

      - name: cargo clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: nix develop -c cargo test

      - name: cargo build --release
        run: nix develop -c cargo build --release
